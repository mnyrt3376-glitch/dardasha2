<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دردشة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --grad:linear-gradient(120deg,#6a00ff 0%,#ff1fa8 30%,#ff7a1a 50%,#00d4d8 70%,#0066ff 100%);
  --p2:#ff2d9b;
  --bg:#f5f5fa;--surface:#fff;--ink:#14102b;--mute:#7b7890;--line:#e6e4ef;
  --out:#efe6ff;--in:#fff;--chatbg:#f5f5fa;
  box-sizing:border-box;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0c17;--surface:#17152a;--ink:#f1eefe;--mute:#9a96b5;--line:#2a2741;--out:#3a1f66;--in:#201e35;--chatbg:#0d0c17;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d0c17;--surface:#17152a;--ink:#f1eefe;--mute:#9a96b5;--line:#2a2741;--out:#3a1f66;--in:#201e35;--chatbg:#0d0c17;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:'Cairo',system-ui,sans-serif;background:var(--bg);color:var(--ink);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit}
#app{height:100%;max-width:560px;margin:auto;position:relative;background:var(--surface);overflow:hidden}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;transition:transform .3s;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--surface)}
.hide{display:none!important}

/* الدخول */
#auth{justify-content:center;padding:28px;gap:14px}
.logo{width:120px;height:120px;border-radius:50%;background:var(--grad);display:grid;place-items:center;margin:0 auto;box-shadow:0 10px 30px rgba(122,28,255,.35)}
.bub{width:58px;height:48px;background:#fff;border-radius:50%;position:relative;display:flex;align-items:center;justify-content:center;gap:5px}
.bub::after{content:"";position:absolute;bottom:-7px;right:10px;border:6px solid transparent;border-top-color:#fff;border-bottom:0;border-right:0;transform:rotate(-12deg)}
.bub i{width:6px;height:6px;border-radius:50%;background:var(--p2);display:block}
#auth h1{font-size:30px;font-weight:800;text-align:center;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.field{display:flex;align-items:center;gap:10px;border:2px solid transparent;background:linear-gradient(var(--surface),var(--surface)) padding-box,var(--grad) border-box;border-radius:16px;padding:0 14px;height:52px}
.field input{flex:1;border:0;background:transparent;color:var(--ink);outline:0;font-size:16px;text-align:right;min-width:0}
.field svg{width:20px;height:20px;flex:none;stroke:#ff2d9b;fill:none;stroke-width:2}
.btn{height:54px;border-radius:999px;background:var(--grad);color:#fff;font-weight:800;font-size:18px;box-shadow:0 8px 22px rgba(255,45,155,.35)}
.link{text-align:center;font-weight:700;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;padding:8px}
#err{color:#e0245e;font-size:14px;min-height:20px;text-align:center}

/* الشريط العلوي */
.top{background:var(--grad);color:#fff;padding:16px 18px;display:flex;align-items:center;gap:12px;min-height:66px}
.top h1{font-size:24px;font-weight:800;flex:1}
.ibtn{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:18px;font-weight:700;flex:none}

/* القائمة */
.search{margin:12px 14px;display:flex;align-items:center;gap:8px;height:46px;border-radius:14px;padding:0 14px;background:var(--bg);border:2px solid transparent;background-image:linear-gradient(var(--bg),var(--bg)),var(--grad);background-origin:border-box;background-clip:padding-box,border-box}
.search input{flex:1;border:0;background:transparent;color:var(--ink);outline:0;font-size:15px;text-align:right;min-width:0}
#rows{flex:1;overflow:auto}
.row{display:flex;gap:12px;padding:12px 16px;align-items:center;width:100%;text-align:right;border-bottom:1px solid var(--line)}
.row:active{background:var(--out)}
.av{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:19px;flex:none;box-shadow:0 3px 10px rgba(0,0,0,.12)}
.mid{flex:1;min-width:0}
.nm{font-weight:800;font-size:16px}
.pv{color:var(--mute);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.meta{font-size:12px;color:var(--mute)}
.empty{padding:40px 24px;text-align:center;color:var(--mute);line-height:1.9}
.fab{position:absolute;bottom:calc(22px + env(safe-area-inset-bottom,0px));left:20px;width:58px;height:58px;border-radius:50%;background:var(--grad);color:#fff;font-size:28px;font-weight:700;box-shadow:0 8px 22px rgba(0,102,255,.35)}

/* المحادثة */
#chat{transform:translateX(-100%);background:var(--chatbg)}
#app.open #chat{transform:none}
#app.open #list{transform:translateX(25%)}
#msgs{flex:1;overflow:auto;padding:16px 12px;display:flex;flex-direction:column;gap:8px}
.m{max-width:78%;padding:9px 13px 6px;border-radius:18px;line-height:1.55;font-size:15px;word-break:break-word;white-space:pre-wrap;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.m.out{align-self:flex-start;background:var(--out);border-end-start-radius:6px}
.m.in{align-self:flex-end;background:var(--in);border-end-end-radius:6px}
.m small{display:block;font-size:11px;color:var(--mute);text-align:left;margin-top:2px}
.bar{display:flex;gap:10px;padding:12px;background:var(--surface);align-items:center;border-top:1px solid var(--line)}
.field-in{flex:1;display:flex;align-items:center;height:48px;border-radius:24px;padding:0 16px;background:var(--bg);border:2px solid transparent;background-image:linear-gradient(var(--bg),var(--bg)),var(--grad);background-origin:border-box;background-clip:padding-box,border-box}
.field-in input{flex:1;border:0;background:transparent;color:var(--ink);outline:0;font-size:15px;text-align:right;min-width:0}
.send{width:48px;height:48px;border-radius:50%;background:var(--grad);color:#fff;font-size:18px;flex:none;display:grid;place-items:center}
.back{font-size:24px;width:34px;color:#fff;line-height:1}
.hav{width:42px;height:42px;font-size:17px;background:rgba(255,255,255,.25)}
#toast{position:absolute;top:80px;right:50%;transform:translateX(50%);background:var(--ink);color:var(--surface);padding:9px 18px;border-radius:14px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9;white-space:nowrap}
#toast.on{opacity:1}

/* الإعدادات */
#settings{z-index:4;transform:translateX(100%);background:var(--bg);overflow:auto}
#settings.open{transform:none}
.spro{text-align:center;padding:30px 16px 10px}
.spro .av{width:110px;height:110px;margin:0 auto 12px;font-size:40px}
.spro h2{font-size:20px;font-weight:800}
.spro p{color:var(--mute);font-size:14px;margin-top:4px}
.opt{display:flex;align-items:center;gap:14px;margin:10px 16px;padding:14px 16px;border-radius:18px;background:var(--surface);box-shadow:0 2px 10px rgba(0,0,0,.05);width:calc(100% - 32px);text-align:right;font-weight:700}
.ico{width:42px;height:42px;border-radius:12px;background:var(--grad);flex:none;display:grid;place-items:center;color:#fff;font-size:16px}
.opt .lbl{flex:1}
.chev{color:var(--mute)}
.pill{padding:4px 12px;border-radius:999px;background:var(--grad);color:#fff;font-size:12px;font-weight:800}
.logout{margin:22px 16px;width:calc(100% - 32px);height:54px;border-radius:999px;background:linear-gradient(90deg,#ff2d55,#ff5a1f);color:#fff;font-weight:800;font-size:17px}
</style>
</head>
<body>
<div id="app">
  <!-- الدخول / إنشاء حساب -->
  <section class="screen" id="auth">
    <div class="logo"><div class="bub"><i></i><i></i><i></i></div></div>
    <h1 id="atitle">تسجيل الدخول</h1>
    <div class="field hide" id="fname-w">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
      <input id="name" placeholder="الاسم الكامل" autocomplete="name">
    </div>
    <div class="field">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
      <input id="email" type="email" placeholder="البريد الإلكتروني" dir="ltr" autocomplete="email">
    </div>
    <div class="field">
      <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>
      <input id="pass" type="password" placeholder="كلمة المرور" dir="ltr" autocomplete="current-password">
    </div>
    <div id="err"></div>
    <button class="btn" id="go">دخول</button>
    <button class="link" id="sw">ما عندك حساب؟ أنشئ حساب جديد</button>
  </section>

  <!-- قائمة المحادثات -->
  <section class="screen" id="list">
    <div class="top">
      <h1>دردشة</h1>
      <button class="ibtn" id="openSet" aria-label="الإعدادات">⋮</button>
    </div>
    <div class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ff2d9b" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" placeholder="ابحث عن محادثة"></div>
    <div id="rows"></div>
    <button class="fab" id="newc" aria-label="محادثة جديدة">+</button>
  </section>

  <!-- المحادثة -->
  <section class="screen" id="chat">
    <div class="top">
      <button class="back" id="back" aria-label="رجوع">→</button>
      <div class="av hav" id="hav"></div>
      <div class="nm" id="hnm" style="flex:1;color:#fff;font-size:17px"></div>
    </div>
    <div id="msgs"></div>
    <div class="bar">
      <button class="send" id="send" aria-label="إرسال">➤</button>
      <div class="field-in"><input id="inp" placeholder="اكتب رسالة"></div>
    </div>
  </section>

  <!-- الإعدادات -->
  <section class="screen" id="settings">
    <div class="top">
      <button class="back" id="backSet" aria-label="رجوع">→</button>
      <h1>الإعدادات</h1>
    </div>
    <div class="spro">
      <div class="av" id="sav"></div>
      <h2 id="sname"></h2>
      <p id="smail" dir="ltr"></p>
    </div>
    <button class="opt" id="themeBtn"><span class="ico">◐</span><span class="lbl">المظهر</span><span class="pill" id="themeLbl">فاتح</span></button>
    <button class="opt" id="notiBtn"><span class="ico">🔔</span><span class="lbl">الإشعارات</span><span class="chev">‹</span></button>
    <button class="opt" id="helpBtn"><span class="ico">?</span><span class="lbl">المساعدة</span><span class="chev">‹</span></button>
    <button class="logout" id="out">تسجيل الخروج</button>
  </section>

  <div id="toast"></div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,onAuthStateChanged,signOut,updateProfile} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,doc,setDoc,collection,query,where,getDocs,onSnapshot,addDoc,orderBy,serverTimestamp,updateDoc} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyB6htPxJnuhyE39gQh97QzpoYP9he0Nilo",
  authDomain:"sama-alyemen.firebaseapp.com",
  projectId:"sama-alyemen",
  storageBucket:"sama-alyemen.firebasestorage.app",
  messagingSenderId:"106270979578",
  appId:"1:106270979578:web:ab455cad3a103c1b07e043"
};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const $=i=>document.getElementById(i);
const COLORS=['#7a1cff','#ff2d9b','#ff8a1a','#00a7b5','#0066ff','#c2185b'];
const colOf=s=>COLORS[[...s].reduce((a,c)=>a+c.charCodeAt(0),0)%COLORS.length];
const esc=s=>{const d=document.createElement('div');d.textContent=s;return d.innerHTML};
const fmt=t=>t?t.toDate().toLocaleTimeString('ar',{hour:'2-digit',minute:'2-digit'}):'';
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2200)}

let me=null,chats=[],cur=null,unsubChats=null,unsubMsgs=null,signup=false;

// ---- الدخول ----
const ERR={'auth/invalid-email':'البريد غير صحيح','auth/weak-password':'كلمة المرور ضعيفة (٦ أحرف على الأقل)','auth/email-already-in-use':'هذا البريد مسجّل من قبل','auth/invalid-credential':'البريد أو كلمة المرور غلط','auth/missing-password':'اكتب كلمة المرور','auth/operation-not-allowed':'فعّل Email/Password من Authentication في Firebase','auth/network-request-failed':'تأكد من الإنترنت'};
$('sw').onclick=()=>{
  signup=!signup;
  $('fname-w').classList.toggle('hide',!signup);
  $('atitle').textContent=signup?'إنشاء حساب':'تسجيل الدخول';
  $('go').textContent=signup?'إنشاء حساب':'دخول';
  $('sw').textContent=signup?'عندك حساب؟ سجّل دخول':'ما عندك حساب؟ أنشئ حساب جديد';
  $('err').textContent='';
};
$('go').onclick=async()=>{
  const email=$('email').value.trim().toLowerCase(),pass=$('pass').value,name=$('name').value.trim();
  $('err').textContent='';
  if(signup&&!name){$('err').textContent='اكتب اسمك';return}
  try{
    if(signup){
      const c=await createUserWithEmailAndPassword(auth,email,pass);
      await updateProfile(c.user,{displayName:name});
      me={uid:c.user.uid,name,email};
      await setDoc(doc(db,'users',me.uid),me);
      start();
    }else await signInWithEmailAndPassword(auth,email,pass);
  }catch(e){$('err').textContent=ERR[e.code]||('خطأ: '+e.code)}
};
onAuthStateChanged(auth,u=>{
  if(u){
    me={uid:u.uid,name:u.displayName||u.email.split('@')[0],email:u.email};
    setDoc(doc(db,'users',me.uid),me,{merge:true}).catch(()=>{});
    start();
  }else{
    me=null;
    if(unsubChats)unsubChats();if(unsubMsgs)unsubMsgs();
    chats=[];$('app').classList.remove('open');$('settings').classList.remove('open');
    $('auth').classList.remove('hide');renderList();
  }
});
function start(){
  $('auth').classList.add('hide');
  $('sav').textContent=me.name.charAt(0);$('sav').style.background=colOf(me.uid);
  $('sname').textContent=me.name;$('smail').textContent=me.email;
  if(unsubChats)unsubChats();
  unsubChats=onSnapshot(query(collection(db,'chats'),where('members','array-contains',me.uid)),s=>{
    chats=s.docs.map(d=>({id:d.id,...d.data({serverTimestamps:'estimate'})}));
    chats.sort((a,b)=>(b.lastAt?.seconds||0)-(a.lastAt?.seconds||0));
    renderList();
  },e=>toast('تعذّر تحميل المحادثات: '+e.code));
}

// ---- القائمة ----
const other=c=>{const id=c.members.find(m=>m!==me.uid);return{id,name:(c.names&&c.names[id])||'مستخدم'}};
function renderList(){
  const f=$('q').value.trim();let h='';
  chats.filter(c=>!f||other(c).name.includes(f)).forEach(c=>{
    const o=other(c);
    h+=`<button class="row" data-id="${c.id}"><div class="av" style="background:${colOf(o.id)}">${esc(o.name.charAt(0))}</div><div class="mid"><div class="nm">${esc(o.name)}</div><div class="pv">${esc(c.last||'ابدأ المحادثة')}</div></div><div class="meta">${fmt(c.lastAt)}</div></button>`;
  });
  $('rows').innerHTML=h||'<p class="empty">ما عندك محادثات بعد.<br>اضغط + وأدخل بريد صديقك<br>(لازم يكون سجّل في التطبيق).</p>';
}
$('q').oninput=renderList;
$('rows').onclick=e=>{const b=e.target.closest('.row');if(b)openChat(b.dataset.id)};
$('openSet').onclick=()=>$('settings').classList.add('open');
$('backSet').onclick=()=>$('settings').classList.remove('open');

$('newc').onclick=async()=>{
  const email=(prompt('بريد الشخص اللي تبي تكلمه')||'').trim().toLowerCase();
  if(!email)return;
  if(email===me.email)return toast('هذا بريدك أنت');
  try{
    const s=await getDocs(query(collection(db,'users'),where('email','==',email)));
    if(s.empty)return toast('ما لقيت مستخدم بهذا البريد');
    const u=s.docs[0].data(),id=[me.uid,u.uid].sort().join('_');
    const info={members:[me.uid,u.uid],names:{[me.uid]:me.name,[u.uid]:u.name}};
    await setDoc(doc(db,'chats',id),info,{merge:true});
    openChat(id,{id,...info});
  }catch(e){toast('خطأ: '+e.code)}
};

// ---- المحادثة ----
function openChat(id,fallback){
  cur=chats.find(c=>c.id===id)||fallback;
  const o=other(cur);
  $('hnm').textContent=o.name;$('hav').textContent=o.name.charAt(0);
  $('msgs').innerHTML='';$('app').classList.add('open');
  if(unsubMsgs)unsubMsgs();
  unsubMsgs=onSnapshot(query(collection(db,'chats',id,'messages'),orderBy('createdAt')),s=>{
    let h='';
    s.docs.forEach(d=>{const m=d.data({serverTimestamps:'estimate'}),mine=m.from===me.uid;
      h+=`<div class="m ${mine?'out':'in'}">${esc(m.text)}<small>${fmt(m.createdAt)}${mine?' ✓':''}</small></div>`});
    $('msgs').innerHTML=h;$('msgs').scrollTop=1e9;
  },e=>toast('خطأ: '+e.code));
}
$('back').onclick=()=>{$('app').classList.remove('open');if(unsubMsgs){unsubMsgs();unsubMsgs=null}cur=null};
async function send(){
  const v=$('inp').value.trim();if(!v||!cur)return;
  $('inp').value='';
  try{
    await addDoc(collection(db,'chats',cur.id,'messages'),{text:v,from:me.uid,createdAt:serverTimestamp()});
    await updateDoc(doc(db,'chats',cur.id),{last:v,lastAt:serverTimestamp()});
  }catch(e){toast('ما انرسلت: '+e.code)}
}
$('send').onclick=send;
$('inp').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();send()}};

// ---- الإعدادات ----
$('themeBtn').onclick=()=>{
  const r=document.documentElement,dark=r.getAttribute('data-theme')==='dark'||(!r.getAttribute('data-theme')&&matchMedia('(prefers-color-scheme:dark)').matches);
  r.setAttribute('data-theme',dark?'light':'dark');
  $('themeLbl').textContent=dark?'فاتح':'داكن';
};
$('notiBtn').onclick=()=>{
  if(!('Notification' in window))return toast('المتصفح ما يدعم الإشعارات');
  Notification.requestPermission().then(p=>toast(p==='granted'?'تم تفعيل الإشعارات':'الإشعارات مو مفعّلة'));
};
$('helpBtn').onclick=()=>toast('للمساعدة راسلنا على البريد');
$('out').onclick=()=>signOut(auth);
renderList();
</script>
</body>
</html>
